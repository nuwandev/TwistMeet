services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: twistmeet
      POSTGRES_USER: twistmeet
      POSTGRES_PASSWORD: twistmeet
    ports:
      - "5432:5432"
    volumes:
      - twistmeet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twistmeet"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local-dev-only mail catcher (DECISIONS.md OD04: no production email provider chosen yet).
  # SMTP on 1025, web inbox UI on 1080 — nothing sent here leaves the machine.
  mailcatcher:
    image: maildev/maildev:2.1.0
    ports:
      - "1080:1080"
      - "1025:1025"

volumes:
  twistmeet-postgres-data:
