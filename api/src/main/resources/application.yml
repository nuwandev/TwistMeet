spring:
  application:
    name: twistmeet-api
  datasource:
    url: ${TWISTMEET_DB_URL:jdbc:postgresql://localhost:5432/twistmeet}
    username: ${TWISTMEET_DB_USER:twistmeet}
    password: ${TWISTMEET_DB_PASSWORD:twistmeet}
  jpa:
    hibernate:
      # 00 §10: "Use migrations, never Hibernate schema auto-update in production." validate
      # keeps that true in every environment, not only production, so a missing migration fails
      # fast instead of Hibernate silently patching the schema.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${TWISTMEET_MAIL_HOST:localhost}
    port: ${TWISTMEET_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${TWISTMEET_SERVER_PORT:8080}

twistmeet:
  web:
    base-url: ${TWISTMEET_WEB_BASE_URL:http://localhost:3000}
  mail:
    from: ${TWISTMEET_MAIL_FROM:no-reply@twistmeet.local}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # The mail catcher is best-effort local/dev infra (DECISIONS.md OD04); MailService already
      # swallows send failures rather than breaking registration, so health should not flip DOWN
      # just because no catcher is currently running.
      enabled: false

logging:
  pattern:
    console: "%d{ISO8601} [%X{requestId}] %-5level %logger{36} - %msg%n"
