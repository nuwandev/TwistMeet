spring:
  datasource:
    url: ${TWISTMEET_DB_URL:jdbc:postgresql://localhost:5432/twistmeet_test}
    username: ${TWISTMEET_DB_USER:twistmeet}
    password: ${TWISTMEET_DB_PASSWORD:twistmeet}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: false
  mail:
    host: 127.0.0.1
    port: 1 # deliberately unreachable; MailService logs and continues rather than failing (see its class comment)

twistmeet:
  web:
    base-url: http://localhost:3000
